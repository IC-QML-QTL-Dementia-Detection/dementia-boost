[project]
name = "dementia-boost"
version = "1.6.0"
description = "QML for classifying patients with dementia "
readme = "README.md"
authors = [{ name = "Kaue Miziara", email = "kauemiziara@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.10.8",
    "nibabel>=5.4.2",
    "numpy>=2.4.3",
    "pandas>=3.0.1",
    "pennylane>=0.45.1",
    "pillow>=12.1.1",
    "qiskit>=2.5.2",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "torch>=2.10.0",
    "torchvision>=0.25.0",
]

[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pre-commit>=4.5.1", "pytest>=9.0.3", "ruff>=0.15.2"]


[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "N", "UP"]

ignore = ["E741", "N806"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"scripts/**/*.py" = ["T201"]
"scripts/*.py" = ["T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
exclude = [".venv"]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]

norecursedirs = [
    ".git",
    ".venv",
    ".pytest_cache",
    ".ruff_cache",
    "__pycache__",
    "data",
    "docs",
    "logs",
    "scripts",
    "tmp",
]

addopts = [
    "--verbose",        # Display each test name while running.
    "--tb=short",       # Compact traceback format for failures.
    "-ra",              # Print short test summary for all non-passing tests.
    "--strict-markers", # Fail on unknown marker names to catch typos early.
]

markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "quantum: marks tests exercising the PennyLane or Qiskit quantum layers",
    "integration: marks end-to-end integration tests requiring model training",
]
